<!-- Correo con el código para entrar a Cruce. Lo usan las plantillas de enlace mágico y de confirmación
     (supabase/config.toml). En la nube se pega igual en el panel: Auth → Emails. -->
<div style="font-family: -apple-system, Helvetica, Arial, sans-serif; color: #141414; max-width: 480px;">
  <h2 style="margin: 0 0 12px;">Tu código para entrar a Cruce</h2>
  <p style="margin: 0 0 16px;">Escribe este código en la app. Vence en una hora y sirve una sola vez.</p>
  <p style="font-size: 36px; font-weight: 900; letter-spacing: 8px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="margin: 0; color: #5c5c5c; font-size: 13px;">Si no lo pediste, ignora este correo: nadie puede entrar sin el código.</p>
</div>
