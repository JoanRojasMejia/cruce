# Proyecto de Xcode generado con XcodeGen.
# Instalar:  brew install xcodegen
# Generar:   cd ios && xcodegen && open Cruce.xcodeproj
# El .xcodeproj no se sube al repo: este archivo es la fuente de verdad.

name: Cruce
# Tres ambientes: Debug → local, Staging → testing y Release → prod (ver Cruce/Config/Cruce.xcconfig).
configs:
  Debug: debug
  Staging: release
  Release: release

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pon aquí tu Team ID de Apple (Xcode > Settings > Accounts) o elígelo en Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  CruceCore:
    path: Packages/CruceCore
  # Solo la app depende de supabase-swift; CruceCore no (así sus pruebas corren en Linux).
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4

targets:
  Cruce:
    type: application
    platform: iOS
    sources:
      - path: Cruce
    # El identificador, el nombre, el ícono y el ambiente de cada configuración están en Cruce.xcconfig;
    # las claves de Supabase (SUPABASE_URL y SUPABASE_ANON_KEY) llegan desde ios/Config.xcconfig.
    configFiles:
      Debug: Cruce/Config/Cruce.xcconfig
      Staging: Cruce/Config/Cruce.xcconfig
      Release: Cruce/Config/Cruce.xcconfig
    info:
      path: Cruce/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: es
        UILaunchScreen:
          UIColorName: LaunchBackground
          # El cuadro del logo, centrado: la entrada "Choque" (LaunchSplash) empieza desde aquí.
          UIImageName: LaunchLogo
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
        # Las lee `SupabaseConfig` al arrancar.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # local, testing o prod; Ajustes lo muestra junto a la versión fuera de prod.
        CRUCE_ENVIRONMENT: $(APP_ENVIRONMENT)
        # Debug habla con Supabase local por http (127.0.0.1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Enlace con un código: <esquema>://codigo/<CÓDIGO> abre "Tengo un código" con el campo lleno (D5). Cada
        # ambiente registra el suyo (cruce-dev, cruce-test y cruce; APP_URL_SCHEME en Cruce.xcconfig), así con varias
        # apps instaladas el enlace abre la de su ambiente. La app lo lee de CRUCE_URL_SCHEME para crear los suyos.
        CRUCE_URL_SCHEME: $(APP_URL_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).codigo
            CFBundleURLSchemes:
              - $(APP_URL_SCHEME)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        # XcodeGen pone AppIcon en el target y le ganaría al .xcconfig; por eso se pasa por APP_ICON_NAME.
        ASSETCATALOG_COMPILER_APPICON_NAME: $(APP_ICON_NAME)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: CruceCore
      - package: Supabase
        product: Supabase

schemes:
  Cruce:
    build:
      targets:
        Cruce: all
    run:
      config: Debug
  Cruce Test:
    build:
      targets:
        Cruce: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging
  Cruce Prod:
    build:
      targets:
        Cruce: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
