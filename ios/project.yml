# Proyecto de Xcode generado con XcodeGen.
# Instalar:  brew install xcodegen
# Generar:   cd ios && xcodegen && open Cruce.xcodeproj
# El .xcodeproj no se sube al repo: este archivo es la fuente de verdad.

name: Cruce
options:
  bundleIdPrefix: com.joanrojas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pon aquí tu Team ID de Apple (Xcode > Settings > Accounts) o elígelo en Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  CruceCore:
    path: Packages/CruceCore
  # Solo la app depende de supabase-swift; CruceCore no (así sus pruebas corren en Linux).
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.4

targets:
  Cruce:
    type: application
    platform: iOS
    sources:
      - path: Cruce
    # Las claves de Supabase (SUPABASE_URL y SUPABASE_ANON_KEY) llegan desde ios/Config.xcconfig.
    configFiles:
      Debug: Cruce/Config/Cruce.xcconfig
      Release: Cruce/Config/Cruce.xcconfig
    info:
      path: Cruce/Info.plist
      properties:
        CFBundleDisplayName: Cruce
        CFBundleDevelopmentRegion: es
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
        # Las lee `SupabaseConfig` al arrancar.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Debug habla con Supabase local por http (127.0.0.1).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joanrojas.cruce
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: CruceCore
      - package: Supabase
        product: Supabase

schemes:
  Cruce:
    build:
      targets:
        Cruce: all
    run:
      config: Debug
