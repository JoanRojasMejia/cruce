# Proyecto de Xcode generado con XcodeGen.
# Instalar:  brew install xcodegen
# Generar:   cd ios && xcodegen && open Cruce.xcodeproj
# El .xcodeproj no se sube al repo: este archivo es la fuente de verdad.

name: Cruce
options:
  bundleIdPrefix: com.joanrojas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Pon aquí tu Team ID de Apple (Xcode > Settings > Accounts) o elígelo en Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Cruce:
    type: application
    platform: iOS
    sources:
      - path: Cruce
    info:
      path: Cruce/Info.plist
      properties:
        CFBundleDisplayName: Cruce
        CFBundleDevelopmentRegion: es
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Archivo-Medium.ttf
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joanrojas.cruce
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  CruceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CruceTests
    dependencies:
      - target: Cruce
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.joanrojas.cruce.tests

schemes:
  Cruce:
    build:
      targets:
        Cruce: all
        CruceTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CruceTests
